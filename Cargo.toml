[package]
name = "wiki"
version = "0.1.0"
edition = "2024"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json","stream","rustls-tls"] }
urlencoding = "2"
strsim = "0.11"
pager = "0.16"
futures-util = "0.3.32"
